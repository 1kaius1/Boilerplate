#
# Runs scripts/test-scaffold.sh on Linux and Windows: every type/language
# combination through both scaffolders, a bash-vs-PowerShell output parity
# check, and shellcheck / PSScriptAnalyzer.
name: scaffold

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run scaffold smoke test
        # Git Bash on Windows; shellcheck is preinstalled on ubuntu-latest only,
        # so static bash analysis runs there and is skipped on Windows.
        shell: bash
        run: scripts/test-scaffold.sh
